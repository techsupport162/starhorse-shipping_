; See .htaccess in this directory for why these exist. This is the
; PHP-FPM/CGI equivalent of its <IfModule mod_php.c> block (mod_php
; ignores this file; PHP-FPM ignores php_flag in .htaccess).
display_errors = Off
display_startup_errors = Off
log_errors = On
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
