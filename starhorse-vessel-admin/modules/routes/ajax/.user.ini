; See .htaccess in this directory for why this override exists.
; This is the PHP-FPM/CGI equivalent — a stock php.ini default
; (e.g. upload_max_filesize=2M) would otherwise silently reject the
; banner (up to 10MB) or destination (up to 5MB) upload before
; functions/helpers.php's validate_image_upload() ever runs.
upload_max_filesize = 10M
post_max_size = 12M
